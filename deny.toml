# cargo-deny policy: licenses compatible with AGPL-3.0-only, no known
# vulnerabilities, crates only from crates.io.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # chrono is unmaintained but has no known vulnerability and no drop-in
  # replacement yet; it comes in through sqlx and the FTP client.
  { id = "RUSTSEC-2026-0543", reason = "transitive via sqlx and suppaftp; no safe alternative yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
