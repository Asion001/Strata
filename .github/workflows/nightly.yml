name: Nightly

# Slower checks that don't need to block every pull request: fresh advisory
# scans (new advisories appear without code changes), a coverage report,
# the property tests at 10,000 cases, each fuzz target for an hour and the
# load test.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Rust advisories
        run: cargo deny --locked check advisories
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: npm advisories (runtime dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strata" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STRATA_TEST_DATABASE_URL: postgres://strata:strata@localhost:5432/strata
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The browser chunker property runs the web chunker under Node.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Rust coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          {
            echo '## Rust coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: lcov.info
          retention-days: 14

  # The property tests at length: 10,000 cases of the file-tree state
  # machine against the real server (Postgres, MinIO) and of the cheap
  # properties (the chunker ones cap themselves: 512 cases, 64 under Node).
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strata" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STRATA_TEST_DATABASE_URL: postgres://strata:strata@localhost:5432/strata
      CARGO_TERM_COLOR: always
      PROPTEST_CASES: "10000"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Property tests (10,000 cases)
        run: |
          cargo test --release -p strata-server --test state_machine
          cargo test --release -p strata-storage --test properties
          cargo test --release -p strata-server --lib range
      # A failing case is saved in proptest-regressions/: keep it.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: proptest-regressions
          path: crates/*/proptest-regressions
          retention-days: 30

  # Each fuzz target for an hour (2 minutes on every PR).
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [path_normalize, range_header, upload_protocol, token_decode, content_disposition]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strata" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STRATA_TEST_DATABASE_URL: postgres://strata:strata@localhost:5432/strata
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz for an hour
        working-directory: fuzz
        run: cargo +nightly fuzz run -O --target x86_64-unknown-linux-gnu ${{ matrix.target }} corpus/${{ matrix.target }} -- -max_total_time=3600 -print_final_stats=1
      # The crash, and the grown corpus to fold back in with `cargo fuzz cmin`.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts
            fuzz/corpus/${{ matrix.target }}
          retention-days: 14

  # oha against the Docker stack, and a 1,000-client WebSocket fan-out
  # (scripts/load-test.sh). Reports in the job summary; no thresholds.
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Web dependencies (BLAKE3 for the upload chunk)
        working-directory: web
        run: npm ci
      - uses: taiki-e/install-action@v2
        with:
          tool: oha
      - name: Load test
        run: scripts/load-test.sh
