name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Licenses, banned and unknown sources, and known vulnerabilities (deny.toml).
      - run: cargo deny --locked check

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strata" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STRATA_TEST_DATABASE_URL: postgres://strata:strata@localhost:5432/strata
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # A btrfs loop device for the capability-detection test (snapshots on
      # btrfs); the MinIO tests use the runner's Docker.
      - name: btrfs test filesystem
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq btrfs-progs
          truncate -s 300M "$RUNNER_TEMP/btrfs.img"
          mkfs.btrfs -q "$RUNNER_TEMP/btrfs.img"
          sudo mkdir -p /mnt/btrfs
          sudo mount -o loop,user_subvol_rm_allowed "$RUNNER_TEMP/btrfs.img" /mnt/btrfs
          sudo chown "$(id -u):$(id -g)" /mnt/btrfs
          echo "STRATA_TEST_BTRFS_DIR=/mnt/btrfs" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run size

  # Browser tests against a real server built from this commit (Chromium,
  # plus WebKit for media playback), so UI changes can't silently break them.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strata" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build
      - name: Build the server
        run: cargo build --locked -p strata-server
      - name: Install Chromium and WebKit for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium webkit
      - name: Start the server
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          # Only the Playwright step reads it (not the job's environment).
          (umask 077; printf %s "$pw" > "$RUNNER_TEMP/e2e-password")
          mkdir -p "$RUNNER_TEMP/strata/data" "$RUNNER_TEMP/strata/files"
          DATABASE_URL=postgres://strata:strata@localhost:5432/strata \
          STRATA_SECRET_KEY=$(openssl rand -hex 32) \
          STRATA_ADMIN_USER=admin STRATA_ADMIN_PASSWORD="$pw" \
          STRATA_BIND=127.0.0.1:8080 \
          STRATA_DATA_DIR="$RUNNER_TEMP/strata/data" \
          STRATA_LOCAL_BASE="$RUNNER_TEMP/strata/files" \
          STRATA_FILES_DIR=files \
          STRATA_WEB_DIR=web/build \
          STRATA_COOKIE_SECURE=false \
          nohup target/debug/strata > "$RUNNER_TEMP/strata.log" 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && exit 0
            kill -0 "$pid" 2>/dev/null || break # exited: show why at once
            sleep 1
          done
          cat "$RUNNER_TEMP/strata.log"
          exit 1
      - name: Playwright (Chromium; WebKit for media playback)
        working-directory: web
        env:
          STRATA_E2E_URL: http://127.0.0.1:8080
          STRATA_E2E_USER: admin
        run: |
          STRATA_E2E_PASSWORD=$(cat "$RUNNER_TEMP/e2e-password") \
            npx playwright test --project=chromium --project=webkit-media --trace retain-on-failure --reporter=list,html
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/strata.log"
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
