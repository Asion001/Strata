# Fuzz targets (cargo-fuzz, libFuzzer): `cargo +nightly fuzz run <target>`.
# A workspace of its own, built only by cargo-fuzz on nightly.
[package]
name = "strata-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
strata-server = { path = "../crates/server" }
strata-storage = { path = "../crates/storage" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
blake3 = "1"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tempfile = "3"
rand = "0.8"

[[bin]]
name = "path_normalize"
path = "fuzz_targets/path_normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "range_header"
path = "fuzz_targets/range_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "upload_protocol"
path = "fuzz_targets/upload_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "token_decode"
path = "fuzz_targets/token_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_disposition"
path = "fuzz_targets/content_disposition.rs"
test = false
doc = false
bench = false
