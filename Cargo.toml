[workspace]
resolver = "3"
members = ["crates/server", "crates/storage", "crates/sync"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Asion001/Strata"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures = "0.3"
blake3 = "1"
hex = "0.4"
rand = "0.8"
opendal = { version = "0.59", default-features = false, features = ["services-fs", "services-s3", "services-ftp", "executors-tokio", "http-transport-reqwest", "layers-retry", "layers-timeout"] }

# Password hashing and content hashing stay fast in debug builds too (tests
# and the CI e2e server sign in often).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
