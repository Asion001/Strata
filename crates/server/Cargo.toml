[package]
name = "strata-server"
description = "Strata self-hosted file cloud: HTTP API and web UI host."
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
strata-storage = { path = "../storage" }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
utoipa.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures.workspace = true
blake3.workspace = true
hex.workspace = true
rand.workspace = true
opendal.workspace = true
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
dashmap = "6"
quick_cache = "0.6"
tokio-util = { version = "0.7", features = ["io"] }
percent-encoding = "2"
mime_guess = "2"
async-stream = "0.3"
cookie = "0.18"

[dev-dependencies]
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["minio"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
