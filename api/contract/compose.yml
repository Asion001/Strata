# The API contract test (scripts/api-contract.sh): Strata built from this
# checkout, with its own Postgres and an S3 server (MinIO), for Schemathesis.
name: strata-contract
services:
  strata:
    build: ../..
    environment:
      DATABASE_URL: postgres://strata:strata@db/strata
      STRATA_SECRET_KEY: ${STRATA_SECRET_KEY:?}
      STRATA_ADMIN_USER: admin
      STRATA_ADMIN_PASSWORD: ${STRATA_ADMIN_PASSWORD:?}
      STRATA_COOKIE_SECURE: "false"
    ports: ["127.0.0.1:${STRATA_PORT:-18090}:8080"]
    # No names outside this stack resolve: connections the fuzzer makes to
    # made-up hosts (or to AWS) fail at once instead of reaching out.
    dns: ["127.0.0.1"]
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
  db:
    image: postgres:18-alpine
    environment: { POSTGRES_USER: strata, POSTGRES_PASSWORD: strata, POSTGRES_DB: strata }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "strata"], interval: 2s, retries: 30 }
  minio:
    # (The official images are no longer published; Chainguard's, pinned.)
    image: cgr.dev/chainguard/minio:latest@sha256:304e0bbeb70a9aa0c40ff26d5a9c0a24296019c6d326ba8b75214fb73441d6e9
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?}
